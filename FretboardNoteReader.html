<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretboard Note Reader – Guitar Note Trainer</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--s2:#f1f5f9;--s3:#e2e8f0;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;--accent:#06b6d4;--accent2:#2563eb;--soft:rgba(6,182,212,.12);--ok:#10b981;--bad:#ef4444;--shadow:0 12px 35px rgba(15,23,42,.08);--glow:0 0 35px rgba(6,182,212,.16);--paper:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020617;--surface:#0f172a;--s2:#1e293b;--s3:#334155;--text:#f8fafc;--text2:#cbd5e1;--muted:#64748b;--border:#1e293b;--accent:#22d3ee;--accent2:#3b82f6;--soft:rgba(34,211,238,.14);--shadow:0 14px 42px rgba(0,0,0,.28);--glow:0 0 45px rgba(34,211,238,.2);--paper:#0b1222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#020617;--surface:#0f172a;--s2:#1e293b;--s3:#334155;--text:#f8fafc;--text2:#cbd5e1;--muted:#64748b;--border:#1e293b;--accent:#22d3ee;--accent2:#3b82f6;--soft:rgba(34,211,238,.14);--shadow:0 14px 42px rgba(0,0,0,.28);--glow:0 0 45px rgba(34,211,238,.2);--paper:#0b1222;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button,select{font:inherit;color:inherit}
button{border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding-bottom:28px}
header{padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:22px;box-shadow:0 10px 26px rgba(6,182,212,.25)}
.brand h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:4px 0 0;color:var(--text2);font-size:.75rem}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--border);color:var(--text2);font-size:1.1rem}
.icon-btn:hover{background:var(--s3)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow)}
.stage{padding:28px;box-shadow:var(--shadow),var(--glow)}
.paper{background:var(--paper);border:1px solid var(--border);border-radius:18px;padding:8px}
#board{display:block;width:100%;height:auto;color:var(--text)}
.feedback{min-height:64px;text-align:center;margin:14px 0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fb-main{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.fb-sub{font-size:.85rem;color:var(--text2)}
.fb-main.ok{color:var(--ok)}.fb-main.bad{color:var(--bad)}
.accs{display:flex;justify-content:center;gap:10px;margin-bottom:12px;min-height:44px}
.acc{width:64px;height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--border);font-size:1.5rem;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",system-ui,sans-serif}
.acc.on{background:var(--soft);border-color:var(--accent);color:var(--accent2)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.key{height:74px;border-radius:16px;background:var(--s2);border:1px solid var(--border);font-size:1.7rem;font-weight:800;transition:transform .08s,background .15s,border-color .15s}
.key:hover:not(:disabled){background:var(--s3)}
.key:active:not(:disabled){transform:scale(.96)}
.key:disabled{cursor:default}
.key.right{background:var(--ok);border-color:var(--ok);color:#fff}
.key.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.nextrow{display:flex;justify-content:center;margin-top:14px;min-height:46px}
.primary{padding:12px 28px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;box-shadow:0 8px 22px rgba(37,99,235,.28)}
.primary[hidden]{display:none}
.hint{margin:12px 0 0;text-align:center;font-size:.75rem;color:var(--muted)}
.settings,.stats{padding:22px;display:flex;flex-direction:column;gap:18px}
.stats{gap:14px}
h2{margin:0;font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.sec{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--s2);padding:4px;border-radius:12px;border:1px solid var(--border)}
.seg button{padding:8px 4px;border-radius:9px;background:transparent;color:var(--text2);font-size:.82rem;font-weight:700}
.seg button.sym{font-size:1.1rem;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",system-ui,sans-serif}
.seg button.on{background:var(--surface);color:var(--accent2);box-shadow:0 2px 8px rgba(15,23,42,.12)}
.note{margin:0;font-size:.75rem;color:var(--muted);line-height:1.4}
hr{border:0;border-top:1px solid var(--border);margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:.88rem;font-weight:600}
.row input{position:absolute;opacity:0;pointer-events:none}
.sw{width:42px;height:24px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.2s}
.row input:checked+.sw{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.row input:checked+.sw::after{transform:translateX(18px)}
.row input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:12px}
.tile b{display:block;font-size:1.35rem;letter-spacing:-.02em}
.tile span{font-size:.72rem;color:var(--text2)}
.hist{display:flex;flex-wrap:wrap;gap:5px;min-height:14px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.link{background:none;color:var(--text2);font-size:.8rem;font-weight:600;text-decoration:underline;align-self:flex-start;padding:0}
@media (max-width:920px){main{grid-template-columns:1fr}}
@media (max-width:520px){.stage{padding:14px}.key{height:60px;font-size:1.4rem}.keys{gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><div class="mark">🎸</div><div><h1>Fretboard Note Reader</h1><p>Memorize every note on the guitar neck</p></div></div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode">🌙</button>
  </header>
  <main>
    <div class="col">
      <section class="card stage">
        <div class="paper"><svg id="board" viewBox="0 0 640 250" role="img" aria-label="Guitar fretboard with one marked note"></svg></div>
        <div class="feedback" aria-live="polite"><div class="fb-main" id="fbMain">What note is this?</div><div class="fb-sub" id="fbSub"></div></div>
        <div class="accs" id="accs"></div>
        <div class="keys" id="keys"></div>
        <div class="nextrow"><button class="primary" id="next" hidden>Next note</button></div>
        <p class="hint">Keys: A–G to answer · ↑ sharp · ↓ flat · Enter for next</p>
      </section>
    </div>
    <div class="col">
      <section class="card settings">
        <div class="sec"><h2>Strings</h2><div class="seg" id="strs"></div></div>
        <div class="sec"><h2>Frets</h2>
          <div class="seg" data-key="max"><button data-v="5">1–5</button><button data-v="7">1–7</button><button data-v="12">1–12</button></div>
          <label class="row">Include open strings<input type="checkbox" id="open"><i class="sw"></i></label>
          <p class="note" id="rangeInfo"></p></div>
        <div class="sec"><h2>Accidentals</h2>
          <div class="seg" data-key="acc"><button data-v="none">None</button><button data-v="sharp" class="sym">♯</button><button data-v="flat" class="sym">♭</button><button data-v="both" class="sym">♯ ♭</button></div></div>
        <hr>
        <label class="row">Auto-advance after correct<input type="checkbox" id="auto"><i class="sw"></i></label>
        <label class="row">Focus on notes I miss<input type="checkbox" id="adapt"><i class="sw"></i></label>
        <label class="row">Play the note's sound<input type="checkbox" id="sound"><i class="sw"></i></label>
        <label class="row">Show fret numbers<input type="checkbox" id="nums"><i class="sw"></i></label>
      </section>
      <section class="card stats">
        <h2>This session</h2>
        <div class="tiles">
          <div class="tile"><b id="stRight">0</b><span>Correct</span></div>
          <div class="tile"><b id="stAcc">–</b><span>Accuracy</span></div>
          <div class="tile"><b id="stStreak">0</b><span>Streak (best <span id="stBest">0</span>)</span></div>
          <div class="tile"><b id="stTime">–</b><span>Avg. time</span></div>
        </div>
        <div class="hist" id="hist"></div>
        <button class="link" id="reset">Reset stats</button>
      </section>
    </div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const LET=["C","D","E","F","G","A","B"],NAT={C:0,D:2,E:4,F:5,G:7,A:9,B:11},SYM={"-1":"♭",0:"","1":"♯"};
const SH=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],FL=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const BLACK=[1,3,6,8,10];
const STR=[{n:"E",m:64},{n:"B",m:59},{n:"G",m:55},{n:"D",m:50},{n:"A",m:45},{n:"E",m:40}]; // top row = high E
const DEF={strings:[0,1,2,3,4,5],max:12,open:true,acc:"none",auto:true,adapt:true,sound:true,nums:true,dark:null};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem("fretNoteReader.v1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("fretNoteReader.v1",JSON.stringify(S))}catch(e){}};
const fresh=()=>({right:0,wrong:0,streak:0,best:0,times:[],hist:[]});
let st=fresh(),cur=null,answered=false,sel=0,t0=0,timer=0,miss={},ac;
const sharpOK=()=>S.acc==="sharp"||S.acc==="both",flatOK=()=>S.acc==="flat"||S.acc==="both";
const noteName=pc=>!BLACK.includes(pc)?SH[pc]:S.acc==="flat"?FL[pc]:S.acc==="both"?SH[pc]+" / "+FL[pc]:SH[pc];
const key=n=>n.s+"-"+n.f;

function pool(){const out=[];
  for(const s of S.strings)for(let f=S.open?0:1;f<=S.max;f++){
    const m=STR[s].m+f,pc=m%12;
    if(S.acc==="none"&&BLACK.includes(pc))continue;
    out.push({s,f,m,pc});}
  return out}
function pick(){const P=pool(),w=P.map(n=>cur&&key(n)===key(cur)&&P.length>1?0:S.adapt?1+2*(miss[key(n)]||0):1);
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<P.length;i++){r-=w[i];if(r<0)return P[i]}return P[0]}

function draw(state){
  const N=S.max,X0=46,X1=628,fw=(X1-X0)/N,Y=i=>28+i*34,fx=f=>f===0?30:X0+(f-.5)*fw;
  let s=`<rect x="${X0}" y="${Y(0)-14}" width="${X1-X0}" height="${Y(5)-Y(0)+28}" rx="4" fill="currentColor" opacity=".05"/>`;
  [3,5,7,9,15].filter(f=>f<=N).forEach(f=>s+=`<circle cx="${fx(f)}" cy="113" r="6" fill="currentColor" opacity=".16"/>`);
  if(N>=12)[79,147].forEach(y=>s+=`<circle cx="${fx(12)}" cy="${y}" r="6" fill="currentColor" opacity=".16"/>`);
  for(let f=1;f<=N;f++)s+=`<line x1="${X0+f*fw}" x2="${X0+f*fw}" y1="${Y(0)-14}" y2="${Y(5)+14}" stroke="currentColor" stroke-width="1.6" opacity=".35"/>`;
  s+=`<line x1="${X0}" x2="${X0}" y1="${Y(0)-14}" y2="${Y(5)+14}" stroke="currentColor" stroke-width="6" opacity=".8" stroke-linecap="round"/>`;
  STR.forEach((t,i)=>{
    s+=`<line x1="${X0}" x2="${X1}" y1="${Y(i)}" y2="${Y(i)}" stroke="currentColor" stroke-width="${1+i*.45}" opacity=".6"/>`;
    s+=`<text x="12" y="${Y(i)+4}" font-size="12" font-weight="800" text-anchor="middle" fill="currentColor" opacity="${S.strings.includes(i)?.75:.25}">${t.n}</text>`;});
  if(S.nums)for(let f=1;f<=N;f++)s+=`<text x="${fx(f)}" y="${Y(5)+34}" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" opacity=".45">${f}</text>`;
  const col=state==="right"?"var(--ok)":state==="wrong"?"var(--bad)":"url(#g)",x=fx(cur.f),y=Y(cur.s);
  s=`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>`+s;
  s+=`<circle cx="${x}" cy="${y}" r="15" fill="${col}"/>`;
  const lbl=state==="idle"?"?":SH[cur.pc].length&&noteName(cur.pc).split(" / ")[0];
  s+=`<text x="${x}" y="${y+5}" font-size="${lbl.length>1?12:14}" font-weight="800" text-anchor="middle" fill="#fff">${lbl}</text>`;
  document.getElementById("board").innerHTML=s}

function accUI(){const b=$("#accs");b.innerHTML="";
  const add=(v,t)=>{const e=document.createElement("button");e.className="acc"+(sel===v?" on":"");e.textContent=t;e.disabled=answered;
    e.setAttribute("aria-label",v>0?"Sharp":"Flat");e.setAttribute("aria-pressed",sel===v);e.onclick=()=>setAcc(v);b.appendChild(e)};
  if(flatOK())add(-1,"♭");if(sharpOK())add(1,"♯")}
function setAcc(v){if(answered||(v===1&&!sharpOK())||(v===-1&&!flatOK()))return;sel=sel===v?0:v;accUI()}

function next(){clearTimeout(timer);cur=pick();answered=false;sel=0;t0=performance.now();
  $("#next").hidden=true;$("#fbMain").className="fb-main";$("#fbMain").textContent="What note is this?";
  $("#fbSub").textContent="String "+(cur.s+1)+" ("+STR[cur.s].n+") · "+(cur.f?"fret "+cur.f:"open string");
  document.querySelectorAll(".key").forEach(k=>{k.className="key";k.disabled=false});
  draw("idle");accUI()}

function answer(L){if(answered)return;answered=true;
  const pc=(NAT[L]+sel+12)%12,ok=pc===cur.pc,ms=performance.now()-t0,k=key(cur),nm=noteName(cur.pc),
    letters=nm.split(" / ").map(x=>x[0]);
  document.querySelectorAll(".key").forEach(b=>{b.disabled=true;
    if(letters.includes(b.dataset.l))b.classList.add("right");
    else if(!ok&&b.dataset.l===L)b.classList.add("wrong")});
  const fm=$("#fbMain");
  if(ok){st.right++;st.streak++;st.best=Math.max(st.best,st.streak);st.times.push(ms);miss[k]=Math.max(0,(miss[k]||0)-1);
    fm.className="fb-main ok";fm.textContent="Correct — "+nm;$("#fbSub").textContent=(ms/1000).toFixed(1)+" s"}
  else{st.wrong++;st.streak=0;miss[k]=(miss[k]||0)+1;
    fm.className="fb-main bad";fm.textContent="It’s "+nm;
    $("#fbSub").textContent=letters.includes(L)?"Right letter — check the accidental (you said "+L+SYM[sel]+")":"You said "+L+SYM[sel]}
  st.hist.push(ok);draw(ok?"right":"wrong");accUI();stats();
  if(S.sound)play(cur);
  if(ok&&S.auto)timer=setTimeout(next,900);else{const b=$("#next");b.hidden=false;b.focus()}}

function play(n){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const f=440*Math.pow(2,(n.m-69)/12),t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1.1);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.15)}catch(e){}}

function stats(){const tot=st.right+st.wrong;
  $("#stRight").textContent=st.right;$("#stAcc").textContent=tot?Math.round(100*st.right/tot)+"%":"–";
  $("#stStreak").textContent=st.streak;$("#stBest").textContent=st.best;
  $("#stTime").textContent=st.times.length?(st.times.reduce((a,b)=>a+b,0)/st.times.length/1000).toFixed(1)+" s":"–";
  $("#hist").innerHTML=st.hist.slice(-30).map(o=>`<i class="dot ${o?"ok":"bad"}"></i>`).join("")}

function sync(){
  document.querySelectorAll(".seg[data-key]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",String(S[g.dataset.key])===b.dataset.v)));
  $("#strs").innerHTML=STR.map((t,i)=>`<button data-i="${i}" class="${S.strings.includes(i)?"on":""}" aria-pressed="${S.strings.includes(i)}" title="String ${i+1}">${i+1}·${t.n}</button>`).join("");
  ["open","auto","adapt","sound","nums"].forEach(k=>$("#"+k).checked=S[k]);
  $("#rangeInfo").textContent=pool().length+" possible notes"+(S.acc==="none"?" (naturals only)":"")}
function changed(){save();sync();cur=null;next()}

document.querySelectorAll(".key").length||($("#keys").innerHTML=LET.map(l=>`<button class="key" data-l="${l}" aria-label="${l}">${l}</button>`).join(""));
document.querySelectorAll(".key").forEach(b=>b.onclick=()=>answer(b.dataset.l));
document.querySelectorAll(".seg[data-key]").forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  S[g.dataset.key]=g.dataset.key==="max"?+b.dataset.v:b.dataset.v;changed()});
$("#strs").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,has=S.strings.includes(i);
  if(has&&S.strings.length===1)return;S.strings=has?S.strings.filter(x=>x!==i):[...S.strings,i].sort();changed()};
$("#open").onchange=e=>{S.open=e.target.checked;changed()};
["auto","adapt","sound","nums"].forEach(k=>$("#"+k).onchange=e=>{S[k]=e.target.checked;save();if(k==="nums")draw(answered?($("#fbMain").classList.contains("ok")?"right":"wrong"):"idle")});
$("#next").onclick=next;
$("#reset").onclick=()=>{st=fresh();miss={};stats()};
const setTheme=d=>{S.dark=d;document.documentElement.dataset.theme=d?"dark":"light";$("#theme").textContent=d?"☀️":"🌙";save()};
$("#theme").onclick=()=>setTheme(!(S.dark===null?matchMedia("(prefers-color-scheme:dark)").matches:S.dark));
setTheme(S.dark===null?matchMedia("(prefers-color-scheme:dark)").matches:S.dark);
addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/^(SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  const k=e.key;
  if(/^[a-gA-G]$/.test(k)){answer(k.toUpperCase());e.preventDefault()}
  else if(k==="ArrowUp"||k==="#"||k==="+"){setAcc(1);e.preventDefault()}
  else if(k==="ArrowDown"||k==="-"){setAcc(-1);e.preventDefault()}
  else if((k==="Enter"||k===" ")&&answered&&e.target.tagName!=="BUTTON"){next();e.preventDefault()}});
sync();stats();next();
</script>
</body>
</html>
